
name: Validate tennis booking sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check booking websites
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request

          sites = {
              "Rosegarden": "https://rosegarden.cintoia.com",
              "Tapiolan Tennis": "https://tennispuisto.cintoia.com",
              "Targa Arena": "https://targaarena.cintoia.com",
              "Esport": "https://esport.fi/en/racket-sports/online-booking-instructions/",
              "Smash Olari": "https://play.fi/smashcenter/booking/booking-calendar?BookingCalForm%5Bp_laji%5D=7",
          }

          for name, url in sites.items():
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as r:
                      html = r.read(200000).decode(
                          "utf-8", errors="replace"
                      )
                      print(
                          f"{name}: HTTP {r.status}, "
                          f"{len(html)} characters, "
                          f"JavaScript required: "
                          f"{'enable javascript' in html.lower()}, "
                          f"booking terms present: "
                          f"{any(t in html.lower() for t in ['varaa', 'varattu', 'booking'])}"
                      )
              except Exception as e:
                  print(f"{name}: ERROR {type(e).__name__}: {e}")
          PY
